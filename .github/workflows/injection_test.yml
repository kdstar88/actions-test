name: Injection Lockdown Test

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  injection-test:
    runs-on: ubuntu-latest
    steps:
      - name: Safe issue title
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          echo "New issue title is: $ISSUE_TITLE"
